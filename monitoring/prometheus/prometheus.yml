global:
  scrape_interval: 5s

scrape_configs:
  - job_name: shrtr-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: shrtr-worker
    # Docker DNS returns one A record per replica, so `--scale worker=N` gets
    # N scrape targets (a static "worker:9100" hit one replica at random)
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
