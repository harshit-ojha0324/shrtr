name: ci
on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit tests/component -q
  # Integration tests run locally against docker compose (see README).
  # Running them in CI with service containers is a TODO (stretch).
